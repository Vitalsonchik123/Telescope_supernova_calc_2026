<!DOCTYPE html>
<html>
<head>
    <title>Добавление заявки</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="add-form">

            {{ if .hasDraft }}
                <!-- ============================================ -->
                <!-- ФОРМА ПУБЛИКАЦИИ (когда черновик уже создан) -->
                <!-- ============================================ -->
                <form action="/publish" method="POST">
                    <input type="hidden" name="id" value="{{ .telescope.ID }}">

                    <div class="media-fields">
                        <div class="image-upload">
                            <div class="file-row">
                                <span>📷 Изображение:</span>
                                <span class="file-name">{{ .telescope.ImageKey }}</span>
                            </div>
                        </div>
                        <div class="video-upload">
                            <div class="file-row">
                                <span>🎥 Видео:</span>
                                <span class="file-name">{{ .telescope.VideoKey }}</span>
                            </div>
                        </div>
                    </div>

                    <div class="text-fields">
                        <label>Название</label>
                        <input type="text" name="name" value="{{ .telescope.Name }}" readonly>

                        <label>Обсерватория</label>
                        <input type="text" name="observatory" value="{{ .telescope.Observatory }}">

                        <label>Краткое описание</label>
                        <input type="text" name="description" value="{{ .telescope.Description }}">

                        <label>Диаметр (см) — поле по теме</label>
                        <input type="number" name="aperture" value="{{ .telescope.ApertureCm }}">

                        <label>Поле зрения — поле по теме</label>
                        <input type="text" name="fov" value="{{ .telescope.FovDeg }}">

                        <label>Фильтры</label>
                        <input type="text" name="filters" value="{{ .telescope.Filters }}">

                        <label>Глубина</label>
                        <input type="text" name="depth" value="{{ .telescope.DepthMag }}">

                        <label>Врем. разрешение</label>
                        <input type="text" name="time_res" value="{{ .telescope.TimeResolution }}">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-confirm">Опубликовать</button>
                    </div>
                </form>

            {{ else }}
                <!-- ============================================ -->
                <!-- ФОРМА СОЗДАНИЯ ЧЕРНОВИКА (черновика нет)     -->
                <!-- ============================================ -->
                <form action="/create-draft" method="POST">
                    <div class="media-fields">
                        <div class="image-upload">
                            <div class="file-row">
                                <span>📷 Изображение:</span>
                                <span class="file-name">не выбрано</span>
                            </div>
                            <input type="text" name="image_key" placeholder="например, ztf_image.jpg">
                        </div>
                        <div class="video-upload">
                            <div class="file-row">
                                <span>🎥 Видео:</span>
                                <span class="file-name">не выбрано</span>
                            </div>
                            <input type="text" name="video_key" placeholder="например, ztf_video.mp4">
                        </div>
                    </div>

                    <div class="text-fields">
                        <label>Название</label>
                        <input type="text" name="name" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-confirm">Далее</button>
                    </div>
                </form>
            {{ end }}

        </div>
    </div>

    <div class="tab-bar">
        <a href="/feed">Лента</a>
        <a href="/add" class="active">Добавить</a>
        <a href="/grid">Плитка</a>
    </div>
</body>
</html>
