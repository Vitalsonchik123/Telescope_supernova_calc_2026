<!DOCTYPE html>
<html>
<head>
    <title>Добавление заявки</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="add-form">
            <form action="/add" method="GET">
                <div class="media-fields">
                    <div class="image-upload">
                        <div class="file-row">
                            <span>📷 Изображение:</span>
                            <span class="file-name">{{ if .telescope.ImageKey }}{{ .telescope.ImageKey }}{{ else }}не выбрано{{ end }}</span>
                        </div>
                        <input type="file" disabled>
                    </div>
                    <div class="video-upload">
                        <div class="file-row">
                            <span>🎥 Видео:</span>
                            <span class="file-name">{{ if .telescope.VideoKey }}{{ .telescope.VideoKey }}{{ else }}не выбрано{{ end }}</span>
                        </div>
                        <input type="file" disabled>
                    </div>
                </div>
                <div class="text-fields">
                    <label>Название</label>
                    <input type="text" name="name" value="{{ .telescope.Name }}">

                    <label>Обсерватория</label>
                    <input type="text" name="observatory" value="{{ .telescope.Observatory }}">

                    <label>Диаметр (см)</label>
                    <input type="number" name="aperture" value="{{ .telescope.ApertureCm }}">

                    <label>Поле зрения</label>
                    <input type="text" name="fov" value="{{ .telescope.FovDeg }}">

                    <label>Фильтры</label>
                    <input type="text" name="filters" value="{{ .telescope.Filters }}">

                    <label>Глубина</label>
                    <input type="text" name="depth" value="{{ .telescope.DepthMag }}">

                    <label>Врем. разрешение</label>
                    <input type="text" name="time_res" value="{{ .telescope.TimeResolution }}">

                    <label>Дата наблюдения</label>
                    <input type="date" name="obs_date" value="2025-10-01">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-confirm">Подтвердить</button>
                    <button type="submit" name="clear" value="true" class="btn btn-secondary">Очистить</button>
                </div>
            </form>
        </div>
    </div>
    <div class="tab-bar">
        <a href="/grid">Лента</a>
        <a href="/add" class="active">Добавить</a>
        <a href="/grid">Плитка</a>
    </div>
</body>
</html>
