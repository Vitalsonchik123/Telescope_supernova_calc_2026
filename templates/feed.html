<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .telescope.Name }} – лента</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app-wrapper feed-wrapper">
        <div class="video-container">
            <video src="{{ .telescope.VideoURL }}" autoplay muted loop></video>
            <div class="overlay">

                <!-- Заголовок + правая колонка (диаметр / поле зрения / лайк) -->
                <div class="title-row">
                    <h1>{{ .telescope.Name }}</h1>
                    <div class="title-right">
                        <div class="sn-data">
                            <span>Диаметр: {{ .telescope.ApertureCm }} см</span>
                            <span>Поле зрения: {{ .telescope.FovDeg }}°</span>
                        </div>
                        <div class="likes">
                            <span class="heart">❤</span> {{ .telescope.Likes }}
                        </div>
                    </div>
                </div>

                <p>{{ .telescope.Observatory }}</p>

                <details class="description-details">
                    <summary>
                        <span class="more">ещё...</span>
                        <span class="less">меньше</span>
                    </summary>
                    <p class="description">{{ .telescope.Description }}</p>
                </details>

                <div class="nav-arrows">
                    <a href="/feed?id={{ .telescope.ID }}&next=true" class="arrow-btn" aria-label="Следующий">→</a>
                </div>
            </div>
        </div>
    </div>
    <div class="tab-bar">
        <a href="/feed?id={{ .telescope.ID }}" class="active">Лента</a>
        <a href="/add">Добавить</a>
        <a href="/grid">Плитка</a>
    </div>
</body>
</html>
