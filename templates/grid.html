<!DOCTYPE html>
<html>
<head>
    <title>Список телескопов</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app-wrapper">
        <form action="/grid" method="GET" class="filter-form">
            <div class="filter-row">
                <div class="slider-container">
                    <label for="aperture-slider">Диаметр от (см):</label>
                    <input type="range"
                           id="aperture-slider"
                           name="min_aperture"
                           min="0"
                           max="1000"
                           step="1"
                           value="{{ .minAperture }}">

                    <div class="slider-scale">
                        <span>0</span>
                        <span>200</span>
                        <span>400</span>
                        <span>600</span>
                        <span>800</span>
                        <span>1000</span>
                    </div>
                </div>

                <!-- Число в отдельном блоке справа -->
                <div class="slider-value-box">
                    {{ .minAperture }}
                </div>
            </div>

            <button type="submit" class="filter-btn">Применить</button>
        </form>

        <div class="grid-container">
            {{ range .telescopes }}
                <div class="card">
                    <a href="/feed?id={{ .Telescope.ID }}">
                        <img src="{{ .ImageURL }}" alt="{{ .Telescope.Name }}">
                        <h3>{{ .Telescope.Name }}</h3>
                        <p>❤ {{ .Likes }}</p>
                        <p>Диаметр: {{ .Telescope.ApertureCm }} см</p>
                    </a>
                    <form action="/delete" method="POST" class="delete-form">
                        <input type="hidden" name="id" value="{{ .Telescope.ID }}">
                        <button type="submit" class="btn-delete">Удалить</button>
                    </form>
                </div>
            {{ else }}
                <p>Нет телескопов, удовлетворяющих фильтру.</p>
            {{ end }}
        </div>
    </div>

    <div class="tab-bar">
        <a href="/feed">Лента</a>
        <a href="/add">Добавить</a>
        <a href="/grid" class="active">Плитка</a>
    </div>
</body>
</html>
